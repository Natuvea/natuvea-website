name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; let an in-progress run finish rather than cancel it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            infr/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infr

      - name: Build infrastructure
        run: npm run build
        working-directory: infr

      - name: Test infrastructure
        run: npm test
        working-directory: infr

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::238576302016:role/GitHubActionsDeploy-NatuveaWebsite
          aws-region: eu-west-2

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        working-directory: infr
